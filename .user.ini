; User configuration file for PHP
; This file is read by PHP when processing requests in this directory

; Increase memory limit to handle large JSON data processing
memory_limit = 256M

; Increase execution time limit
max_execution_time = 300

; Increase input time limit
max_input_time = 300

; Increase post max size if needed
post_max_size = 64M

; Increase upload max filesize if needed
upload_max_filesize = 64M
